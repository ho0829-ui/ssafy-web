<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .card {
      width: 300px;
      border: 1px solid black;
      overflow: hidden;
      padding: 20px;
    }

    .img-container {
      position: relative;
      width: 100%;
    }

    .img-container img {
      width: 100%;
      display: block;
    }
    .img-container .name {
      position: absolute;
      bottom: 0;
      left: 0;
      margin: 0;
      width: 100%;
      padding: 10px;
      color: black;
      text-align: center;
      font-weight: bold;
      background: rgba(160, 134, 95, 0.9);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="img-container">
      <img src="profile.jpg" alt="Profile Image">
      <p class="name">Name</p>
    </div>
    <p class="detail">Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci unde officiis ad nostrum. Laboriosam mollitia similique provident fuga tenetur saepe sit, amet eaque neque eius quaerat expedita ea illum veniam.</p>
  </div>
</body>
</html>
