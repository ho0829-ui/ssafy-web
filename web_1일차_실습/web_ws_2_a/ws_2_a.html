<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Business card
    </title>
    
  <style>
      .container{
          width: 80%;
          height: 1800px;
          background-color: #f2f2f2;
          border: 1px solid black;
          margin: 0 auto;
      }

      .top-button {
        position: fixed;
        right: 40px;
        bottom: 40px;
        background-color: ivory;
        border: 2px solid #222;
        border-radius: 50%;
        height: 40px;
        width: 40px;
        cursor: pointer;
      }

      .top-button a {
        text-decoration: none;
        font-size: 12px;
        color: #333;
        text-align: center;
      }

  </style>
</head>
<body>

  <div class="container">
  </div>
  <button class="top-button">
    <a href="#">TOP</a></button>
</body>
</html>
