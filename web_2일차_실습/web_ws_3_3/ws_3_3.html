<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
  </style>
</head>
<body>
  <div class="container mt-3">

    <div class="alert bg-danger text-white mb-3" role="alert">
      Invalid Login or password
    </div>

    <h1 class="text-center fw-bold mb-3">SSAFY 전용 Gitlab 시스템</h1>
    <hr class="mb-3">

    <div class="card">
      <div class="card-header text-center bg-white border-bottom border-primary border-3 pt-3 pb-3">
        <span class="fw-bold fs-5">Sign in</span>
      </div>

      <div class="card-body p-4">
        <form>
          <div class="mb-3">
            <label for="username" class="form-label fw-bold">Username or Email</label>
            <input type="text" class="form-control" id="username">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-bold">Password</label>
            <input type="password" class="form-control" id="password">
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label text-secondary" for="rememberMe">
                Remember me
              </label>
            </div>
            <a href="#" class="text-decoration-none">Forgot your password?</a>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
