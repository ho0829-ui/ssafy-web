<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar fixed-top bg-dark navbar-dark px-4">
    <div class="d-flex justify-content-between align-items-center w-100">
      
      <a class="navbar-brand d-flex align-items-center me-0" href="#">
        <img src="./images/logo.png" alt="logo" width="120" height="48" class="d-inline-block align-text-top">
      </a>

      <ul class="nav d-flex align-items-center gap-4 mb-0">
        <li class="nav-item">
          <a class="nav-link text-white-50 active p-0" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white-50 p-0" href="#">Community</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white-50 p-0" href="#">Login</a>
        </li>
      </ul>

    </div>
  </nav>
  <header class="position-relative bg-dark min-vh-100 d-flex flex-column justify-content-center align-items-center text-center text-white px-3 overflow-hidden">
    <img src="./images/header.jpg" alt="Background" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover opacity-50">
    <div class="position-relative z-1 d-flex flex-column align-items-center">
      <h1 class="display-2 fw-bold mb-3">Cinema</h1>
      <p class="display-2 fw-bold mb-4">Community</p>
      <button type="button" class="btn btn-primary btn-lg">Let's go</button>
    </div>
  </header>

  <section class="py-5 px-3 content-section d-flex flex-column align-items-center text-center bg-white">
    <h2 class="display-6 fw-bold mb-5 text-uppercase tracking-wider">Used Skills</h2>
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4 gap-md-5 w-100 max-w-lg">
      
      <div class="skill-card d-flex flex-column align-items-center text-center p-3 rounded-4">
        <div class="skill-circle p-3 bg-light rounded-circle shadow-sm mb-3 d-flex justify-content-center align-items-center">
          <img src="./images/web.png" alt="WEB" class="img-fluid" style="max-height: 60px;">
          <i class="fa-solid fa-globe fa-3x text-primary" style="display: none;"></i>
        </div>
        <small class="fw-bold text-secondary text-uppercase tracking-wide">WEB</small>
      </div>
      <div class="skill-card d-flex flex-column align-items-center text-center p-3 rounded-4">
        <div class="skill-circle p-3 bg-light rounded-circle shadow-sm mb-3 d-flex justify-content-center align-items-center">
          <img src="./images/html5.png" alt="HTML5" class="img-fluid" style="max-height: 60px;">
          <i class="fa-brands fa-html5 fa-3x text-danger" style="display: none;"></i>
        </div>
        <small class="fw-bold text-secondary text-uppercase tracking-wide">HTML5</small>
      </div>
      <div class="skill-card d-flex flex-column align-items-center text-center p-3 rounded-4">
        <div class="skill-circle p-3 bg-light rounded-circle shadow-sm mb-3 d-flex justify-content-center align-items-center">
          <img src="./images/css3.png" alt="CSS3" class="img-fluid" style="max-height: 60px;">
          <i class="fa-brands fa-css3-alt fa-3x text-primary" style="display: none;"></i>
        </div>
        <small class="fw-bold text-secondary text-uppercase tracking-wide">CSS3</small>
      </div>

    </div>
  </section>

  <footer class="fixed-bottom bg-primary text-white py-2 px-4 shadow-lg">
    <div class="d-flex align-items-center justify-content-between w-100 position-relative">
      <div class="d-flex align-items-center">
        <img src="./images/ssafy_logo.png" alt="ssafy Logo" width="100" height="40" class="object-fit-contain brightness-0 invert">
      </div>
      <div class="position-absolute start-50 translate-middle-x text-center w-auto">
        <p class="mb-0 small fw-medium">HTML & CSS project. Created by JH</p>
      </div>
      <div style="width: 100px;"></div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
